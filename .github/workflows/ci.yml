name: CI

on:
  pull_request: ~
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:

  smoke:
    name: ${{ matrix.name }}
    uses: sanko/workflow-testing/.github/workflows/unified-tester.yml@v1
    secrets: inherit
    with:
      platform_name: ${{ matrix.name }}
      runner_type: 'direct'
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      toolchain: 'gcc'
      prepare: ${{ matrix.prepare }}
      task: |
        perl -V
        perl hello.pl
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'linux-x64'
            os: 'ubuntu-latest'
            arch: 'x86_64'
            prepare: ''
          - name: 'macos-arm64'
            os: 'macos-15'
            arch: 'aarch64'
            prepare: ''
          - name: 'windows-x64'
            os: 'windows-latest'
            arch: 'x86_64'
            # Windows Git Bash ships no perl; install Strawberry Perl first.
            prepare: 'choco install strawberryperl'

  bsd-smoke:
    name: freebsd-x86_64
    uses: sanko/workflow-testing/.github/workflows/unified-tester.yml@v1
    secrets: inherit
    with:
      platform_name: freebsd
      runner_type: 'vm'
      os: 'freebsd'
      os_version: '15.0'
      arch: 'x86_64'
      toolchain: 'clang'
      prepare: 'pkg install -y perl5 llvm'
      task: |
        perl -V
        perl hello.pl

  results:
    name: Summary
    if: always()
    needs: [smoke, bsd-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: result-artifact-*
          path: results/
          merge-multiple: true

      - name: Generate Job Summary from Artifacts
        shell: bash
        run: |
          echo "| Setup | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          if [ -d "results" ] && [ -n "$(ls -A results)" ]; then
            find results -type f -name "*.result" | sort | while IFS= read -r file; do
              result=$(cat "$file")
              icon=$([[ $result == 'success' ]] && echo ':white_check_mark:' || echo ':x:')
              echo "| \`$(basename "$file" .result)\` | $icon $result |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "| All jobs | | No result data found. :x: |" >> $GITHUB_STEP_SUMMARY
          fi
