name: CI

on:
  pull_request: ~
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:

  smoke:
    name: ${{ matrix.name }}
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      platform_name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      toolchain: 'gcc'
      prepare: ${{ matrix.prepare }}
      variant: ${{ matrix.variant }}
      task: |
        perl -V
        perl hello.pl
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'linux-x64'
            os: 'ubuntu-latest'
            arch: 'x86_64'
            prepare: ''
          - name: 'macos-arm64'
            os: 'macos-15'
            arch: 'aarch64'
            prepare: ''
          - name: 'windows-x64'
            os: 'windows-latest'
            arch: 'x86_64'
            # Windows Git Bash ships no perl; install Strawberry Perl first.
            prepare: 'choco install strawberryperl'
          - name: 'linux-x64-longdoubles'
            os: 'ubuntu-latest'
            arch: 'x86_64'
            prepare: ''
            variant: 'longdoubles'

  bsd-smoke:
    name: freebsd-x86_64
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      platform_name: freebsd
      os: 'freebsd'
      os_version: '15.0'
      arch: 'x86_64'
      toolchain: 'clang'
      prepare: 'pkg install -y perl5 llvm'
      task: |
        perl -V
        perl hello.pl

  results:
    name: Summary
    if: always()
    needs: [smoke, bsd-smoke]
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
